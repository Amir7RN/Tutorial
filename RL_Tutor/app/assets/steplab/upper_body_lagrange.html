<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sagittal equations of motion, by hand</title>
<link rel="stylesheet" href="steplab.css">
<style>
  .grid{grid-template-columns:minmax(0,1.1fr) minmax(400px,1fr)}
  .view{min-height:470px}
  #cv{width:100%;height:100%;display:block}
  .jc label{display:grid;grid-template-columns:120px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:.83rem;margin:2px 0}
  .jc output{font-family:var(--mono);text-align:right;font-size:.8rem}
  .jc input[type=range]{width:100%;accent-color:var(--a)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
  .math{font-size:.9rem}
  .math .eq{white-space:pre-wrap}
  .pick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted);margin:4px 0}
  .pick button{padding:3px 8px;font-size:.8rem}
  .kb{font-weight:700;color:var(--a)}
</style>
</head><body>
<div class="wrap">
  <div class="top"><h1>Sagittal plane: the equations of motion, by hand</h1>
    <p>The same recipe as pages 133 and 134, on the legs–torso–arms chain. Every number on the right is computed at the posture on the left; set the sliders, then do the step on paper and compare.</p></div>
  <div class="grid">
    <div class="left">
      <div class="card view" id="view"><canvas id="cv"></canvas></div>
      <div class="card"><div class="two jc" id="ctl"></div>
        <div class="pick" id="pick"></div></div>
    </div>
    <div class="side">
      <div class="card"><p class="h">steps</p><div class="steps" id="steps"></div>
        <div class="nav"><button id="prev">◀ back</button><button class="primary" id="next">next ▶</button></div></div>
      <div class="card"><p class="h">the numbers at this posture</p><div class="math" id="math"></div></div>
    </div>
  </div>
</div>
<script src="ub.js"></script>
<script>
(() => {
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const f = (x, d = 3) => (Math.abs(x) < 5e-4 ? 0 : x).toFixed(d);
const D = 180 / Math.PI;
const m = UB.planes.sagittal, L = m.links, n = 4;
const names = ['legs', 'torso', 'upper arms', 'forearms'], jn = ['ankle', 'waist', 'shoulder', 'elbow'];
const S = { q: [0.15, -0.2, -0.9, -0.6], qd: [0.6, -0.5, 2.0, 1.0], st: 0, i: 2, j: 1, lock: 3 };
const mat = (A, d = 3, name) => { const s = A.map(r => r.map(x => f(x, d))); const w = Math.max(...s.flat().map(x => x.length)); return s.map((r, i) => (name && i === Math.floor((A.length - 1) / 2) ? name + ' = ' : ' '.repeat(name ? name.length + 3 : 0)) + '[ ' + r.map(x => x.padStart(w)).join('  ') + ' ]').join('\n'); };
const vec = (v, d = 3) => '[ ' + v.map(x => f(x, d)).join(', ') + ' ]';
const EQ = s => `<span class="eq">${s}</span>`;

const STEPS = [
  ['The chain and its coordinates', `Four links on a pinned ankle. <span class="kb">q<sub>i</sub></span> is the joint angle relative to the link below, positive when the top of the link moves forward (the G1's own sign). The absolute pitch of link i is <span class="kb">φ<sub>i</sub> = Σ<sub>j≤i</sub> (q<sub>j</sub> + off<sub>j</sub>)</span>, with off = π at the shoulder so that the arms hang at q = 0. Both arms move together, so they are one link of twice the mass.`],
  ['Positions of the joints and the centres of mass', `The direction of link i is <span class="kb">u<sub>i</sub> = (sin φ<sub>i</sub>, cos φ<sub>i</sub>)</span>: straight up at φ = 0, tipping forward as φ grows. Then <span class="kb">p<sub>i+1</sub> = p<sub>i</sub> + L<sub>i</sub> u<sub>i</sub></span> and <span class="kb">c<sub>i</sub> = p<sub>i</sub> + r<sub>i</sub> u<sub>i</sub></span>. Nothing else is needed: every later step is made of these points.`],
  ['The velocity of each centre of mass: a Jacobian', `Turn joint j by a small angle and every point above it swings about p<sub>j</sub>. A point at offset <span class="kb">d = c<sub>i</sub> − p<sub>j</sub></span> moves by <span class="kb">(d<sub>y</sub>, −d<sub>x</sub>)</span> per radian (perpendicular to d, forward sense). That vector is column j of the COM Jacobian J<sub>i</sub>, and it is zero for j &gt; i: a joint cannot move what is below it. So <span class="kb">v<sub>i</sub> = J<sub>i</sub> q̇</span>. Pick (i, j) below to see the arm and the swing.`],
  ['Kinetic energy, and the mass matrix falls out', `<span class="kb">K = Σ<sub>i</sub> ½ m<sub>i</sub> v<sub>i</sub>·v<sub>i</sub> + ½ I<sub>i</sub> ω<sub>i</sub>²</span>, with ω<sub>i</sub> = Σ<sub>j≤i</sub> q̇<sub>j</sub>. Substitute v<sub>i</sub> = J<sub>i</sub> q̇ and collect: <span class="kb">K = ½ q̇ᵀ M q̇</span> with <span class="kb">M = Σ<sub>i</sub> m<sub>i</sub> J<sub>i</sub>ᵀJ<sub>i</sub> + I<sub>i</sub> J<sub>ωi</sub>ᵀJ<sub>ωi</sub></span>. Entry (a, b) is Σ over the links both joints move of m (swing<sub>a</sub>·swing<sub>b</sub>) + I: exactly page 134's "mass × arm × arm × cosine".`],
  ['Potential energy, and gravity', `<span class="kb">P = Σ m<sub>i</sub> g c<sub>i,y</sub></span>. Its gradient is the torque needed to hold the posture: <span class="kb">g<sub>j</sub> = ∂P/∂q<sub>j</sub> = −g Σ<sub>i≥j</sub> m<sub>i</sub> (c<sub>i</sub> − p<sub>j</sub>)<sub>x</sub></span>, because raising joint j by dq lifts each mass above it by −d<sub>x</sub> dq. Only the <i>horizontal</i> distance to each mass makes a lever for gravity, and a forward lean needs a backward (negative) torque.`],
  ['The velocity-product term, without Christoffel symbols', `Hold q̈ = 0 and let the joints spin: the COMs still accelerate (centripetal and Coriolis). Differentiate v<sub>i</sub> once more: <span class="kb">a<sub>i</sub><sup>vel</sup> = Σ<sub>j≤i</sub> q̇<sub>j</sub> swing(v<sub>i</sub> − ṗ<sub>j</sub>)</span>, where ṗ<sub>j</sub> is the velocity of joint point j. Then <span class="kb">c = Σ<sub>i</sub> m<sub>i</sub> J<sub>i</sub>ᵀ a<sub>i</sub><sup>vel</sup></span>. Page 134 reaches the same vector through ∂M/∂q; this way is what a program computes, and it is what ub.js and ctrlcore/upperbody.py do.`],
  ['The equation of motion', `<span class="kb">τ = M(q) q̈ + c(q, q̇) + g(q)</span>. Read it at this posture: with q̈ = 0 the motors must supply c + g to keep the joints moving at exactly these rates; with q̇ = 0 as well, only g. The ankle entry τ<sub>0</sub> is special: there is no motor there, only a foot. Whatever the equation asks of τ<sub>0</sub> beyond m g × (foot length) is a fall.`],
  ['Lock a joint: delete a column', `Freezing joint k means q̇<sub>k</sub> = q̈<sub>k</sub> = 0. In every sum the k-th swing vector is still there (the mass still rides along) but it is multiplied by nothing. Keep the free columns with a selection matrix S: <span class="kb">Sᵀ M S q̈<sub>free</sub> + Sᵀ(c + g) = Sᵀ τ</span>. The diagonal entries of the free joints do not change; the locked joint's row becomes a constraint torque the structure provides.`],
  ['Preview: the same Jacobians give the momentum', `Angular momentum about the ankle: <span class="kb">H<sub>O</sub> = Σ<sub>i</sub> I<sub>i</sub> ω<sub>i</sub> + m<sub>i</sub> (c<sub>i</sub> × v<sub>i</sub>)</span>, which is linear in q̇: <span class="kb">H<sub>O</sub> = A<sub>O</sub>(q) q̇</span>. Compare row A<sub>O</sub> with row 0 of M: at q = 0 they are identical, because "the ankle's share of the inertia" and "the momentum about the ankle per unit joint rate" are the same sum. Page 167 builds everything on this.`],
];
const ctl = document.getElementById('ctl');
ctl.innerHTML = [0, 1, 2, 3].map(i => `<label><span>q<sub>${i}</sub> ${jn[i]}</span> <input type="range" data-k="q" data-i="${i}" min="${i === 0 ? -0.6 : L[i].lo}" max="${i === 0 ? 0.6 : L[i].hi}" step="0.01" value="${S.q[i]}"><output>${f(S.q[i] * D, 0)}°</output></label>`).join('') +
  [0, 1, 2, 3].map(i => `<label><span>q̇<sub>${i}</sub> ${jn[i]}</span> <input type="range" data-k="qd" data-i="${i}" min="-4" max="4" step="0.1" value="${S.qd[i]}"><output>${f(S.qd[i], 1)} rad/s</output></label>`).join('');
ctl.querySelectorAll('input').forEach(r => r.oninput = () => { S[r.dataset.k][+r.dataset.i] = +r.value; r.nextElementSibling.textContent = r.dataset.k === 'q' ? f(+r.value * D, 0) + '°' : f(+r.value, 1) + ' rad/s'; draw(); });
const stepsEl = document.getElementById('steps');
function renderSteps() {
  stepsEl.innerHTML = STEPS.map((s, i) => `<button class="step" aria-current="${i === S.st}"><span class="n">${i + 1}</span><span><b>${s[0]}</b><span class="t">${s[1]}</span></span></button>`).join('');
  stepsEl.querySelectorAll('.step').forEach((b, i) => b.onclick = () => { S.st = i; draw(); });
}
document.getElementById('prev').onclick = () => { S.st = Math.max(0, S.st - 1); draw(); };
document.getElementById('next').onclick = () => { S.st = Math.min(STEPS.length - 1, S.st + 1); draw(); };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') document.getElementById('next').click(); if (e.key === 'ArrowLeft') document.getElementById('prev').click(); });

function pick() {
  const el = document.getElementById('pick');
  if (S.st === 2) el.innerHTML = 'swing of COM <b>i</b> about joint <b>j</b>: ' + [0, 1, 2, 3].map(i => `<button data-i="${i}" aria-pressed="${S.i === i}">i = ${names[i]}</button>`).join('') + ' &nbsp; ' + [0, 1, 2, 3].map(j => `<button data-j="${j}" aria-pressed="${S.j === j}">j = ${jn[j]}</button>`).join('');
  else if (S.st === 7) el.innerHTML = 'lock: ' + [1, 2, 3].map(k => `<button data-l="${k}" aria-pressed="${S.lock === k}">${jn[k]}</button>`).join('');
  else el.innerHTML = '';
  el.querySelectorAll('button').forEach(b => b.onclick = () => { if (b.dataset.i) S.i = +b.dataset.i; if (b.dataset.j) S.j = +b.dataset.j; if (b.dataset.l) S.lock = +b.dataset.l; draw(); });
}
/* ---------- drawing ---------- */
const cv = document.getElementById('cv');
function draw() {
  renderSteps(); pick();
  const k = UB.core(m, S.q, S.qd, { about: [0, 0] }), kc = UB.core(m, S.q, S.qd);
  const r = cv.getBoundingClientRect(), W = Math.round(r.width), H = Math.round(r.height);
  if (cv.width !== W * devicePixelRatio) { cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio; }
  const c = cv.getContext('2d'); c.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  c.fillStyle = css('--inset'); c.fillRect(0, 0, W, H);
  const sc = Math.min(W / 2.2, H / 1.75), ox = W / 2, oy = H - 40;
  const X = p => ox + p[0] * sc, Y = p => oy - p[1] * sc;
  // floor + foot
  c.strokeStyle = css('--line'); c.lineWidth = 1; c.beginPath(); c.moveTo(0, oy); c.lineTo(W, oy); c.stroke();
  c.fillStyle = css('--grey'); c.fillRect(X([-.07, 0]), oy - 3, .2 * sc, 5);
  // links
  const cols = [css('--grey'), css('--a'), css('--c'), css('--c')];
  for (let i = 0; i < n; i++) {
    c.strokeStyle = cols[i]; c.lineWidth = i < 2 ? 9 : 6; c.lineCap = 'round'; c.beginPath(); c.moveTo(X(k.p[i]), Y(k.p[i])); c.lineTo(X(k.p[i + 1]), Y(k.p[i + 1])); c.stroke();
  }
  // joints and COMs
  for (let i = 0; i < n; i++) { c.fillStyle = css('--panel'); c.strokeStyle = css('--ink'); c.lineWidth = 1.5; c.beginPath(); c.arc(X(k.p[i]), Y(k.p[i]), 5, 0, 7); c.fill(); c.stroke(); }
  for (let i = 0; i < n; i++) { c.fillStyle = css('--b'); c.beginPath(); c.arc(X(k.c[i]), Y(k.c[i]), 4 + 2 * Math.cbrt(L[i].m), 0, 7); c.fill(); }
  c.fillStyle = css('--bad'); c.beginPath(); c.arc(X(kc.xc), Y(kc.xc), 7, 0, 7); c.fill();
  c.setLineDash([4, 4]); c.strokeStyle = css('--bad'); c.beginPath(); c.moveTo(X(kc.xc), Y(kc.xc)); c.lineTo(X(kc.xc), oy); c.stroke(); c.setLineDash([]);
  const arrow = (a, v, col, w = 2, scale = 1) => { const bx = a[0] + v[0] * scale, by = a[1] + v[1] * scale; const A = [X(a), Y(a)], B = [X([bx, by]), Y([bx, by])]; const L2 = Math.hypot(B[0] - A[0], B[1] - A[1]); if (L2 < 2) return; c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(...A); c.lineTo(...B); c.stroke(); const ang = Math.atan2(B[1] - A[1], B[0] - A[0]); c.beginPath(); c.moveTo(...B); c.lineTo(B[0] - 9 * Math.cos(ang - .4), B[1] - 9 * Math.sin(ang - .4)); c.lineTo(B[0] - 9 * Math.cos(ang + .4), B[1] - 9 * Math.sin(ang + .4)); c.closePath(); c.fill(); };
  const text = (p, s, col, dx = 8, dy = -8) => { c.fillStyle = col; c.font = '12px ' + css('--mono'); c.fillText(s, X(p) + dx, Y(p) + dy); };
  // per step overlays
  if (S.st === 0) { for (let i = 0; i < n; i++) text(k.p[i], `p${i} ${jn[i]}  q${i} = ${f(S.q[i] * D, 0)}°`, css('--ink')); text(k.p[n], 'p4 (hand)', css('--ink')); }
  if (S.st === 1) { for (let i = 0; i < n; i++) { text(k.c[i], `c${i} = (${f(k.c[i][0], 2)}, ${f(k.c[i][1], 2)})`, css('--b')); } for (let i = 1; i <= n; i++) text(k.p[i], `p${i} = (${f(k.p[i][0], 2)}, ${f(k.p[i][1], 2)})`, css('--ink'), 8, 14); }
  if (S.st === 2) {
    const i = S.i, j = S.j;
    if (j <= i) { const d = [k.c[i][0] - k.p[j][0], k.c[i][1] - k.p[j][1]]; c.setLineDash([5, 4]); c.strokeStyle = css('--d'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(k.p[j]), Y(k.p[j])); c.lineTo(X(k.c[i]), Y(k.c[i])); c.stroke(); c.setLineDash([]);
      arrow(k.c[i], [d[1], -d[0]], css('--e'), 2.5, .5); text(k.c[i], `swing = (${f(d[1], 2)}, ${f(-d[0], 2)}) per rad`, css('--e'), 10, 18); text(k.p[j], `d from ${jn[j]}`, css('--d'), -70, -8); }
    else text(k.c[i], `${jn[j]} cannot move the ${names[i]}: column is zero`, css('--grey'), 10, 18);
    arrow(k.c[i], k.v[i], css('--f'), 2.5, .25); text(k.c[i], `v${i} = ${vec(k.v[i], 2)} m/s`, css('--f'), 10, -12);
  }
  if (S.st === 3) for (let i = 0; i < n; i++) { arrow(k.c[i], k.v[i], css('--f'), 2, .25); text(k.c[i], `½m v² + ½Iω² = ${f(.5 * L[i].m * (k.v[i][0] ** 2 + k.v[i][1] ** 2) + .5 * L[i].I * k.w[i] ** 2, 2)} J`, css('--f'), 10, -10); }
  if (S.st === 4) for (let i = 0; i < n; i++) { arrow(k.c[i], [0, -1], css('--d'), 2, .12 * Math.cbrt(L[i].m)); text(k.c[i], `m g = ${f(L[i].m * m.g, 0)} N, lever to ankle ${f(k.c[i][0], 3)} m`, css('--d'), 10, 16); }
  if (S.st === 5) for (let i = 0; i < n; i++) { arrow(k.c[i], k.a[i], css('--b'), 2, .04); text(k.c[i], `a${i}(q̈=0) = ${vec(k.a[i], 1)} m/s²`, css('--b'), 10, -10); }
  if (S.st === 7) { const kk = S.lock; c.strokeStyle = css('--grey'); c.lineWidth = 3; c.beginPath(); c.arc(X(k.p[kk]), Y(k.p[kk]), 11, 0, 7); c.stroke(); text(k.p[kk], 'locked', css('--grey'), 14, 4); }
  if (S.st === 8) { for (let i = 0; i < n; i++) { arrow(k.c[i], k.v[i], css('--f'), 2, .25); text(k.c[i], `H${i} = ${f(k.link_H[i], 2)}`, css('--f'), 10, -10); } }
  math(k, kc);
}
function math(k, kc) {
  const el = document.getElementById('math'), st = S.st;
  const swing = (i, j) => [k.Jx[i][j], k.Jy[i][j]];
  let h = '';
  if (st === 0) h = `<p>${[0, 1, 2, 3].map(i => `L<sub>${i}</sub> = ${L[i].L} m, r<sub>${i}</sub> = ${L[i].r} m, m<sub>${i}</sub> = ${L[i].m} kg, I<sub>${i}</sub> = ${L[i].I} kg·m²`).join('<br>')}</p>` +
    EQ(`φ = cumsum(q + off) = ${vec(k.phi)} rad\n  off = [0, 0, π, 0]`);
  if (st === 1) h = EQ([0, 1, 2, 3].map(i => `u${i} = (sin φ${i}, cos φ${i}) = (${f(Math.sin(k.phi[i]))}, ${f(Math.cos(k.phi[i]))})\np${i + 1} = p${i} + L${i} u${i} = (${f(k.p[i + 1][0])}, ${f(k.p[i + 1][1])})\nc${i} = p${i} + r${i} u${i} = (${f(k.c[i][0])}, ${f(k.c[i][1])})`).join('\n'));
  if (st === 2) { const i = S.i, j = S.j; const d = [k.c[i][0] - k.p[j][0], k.c[i][1] - k.p[j][1]];
    h = EQ(`J${i} (2 × 4), column j = ∂c${i}/∂q_j:\n${mat([k.Jx[i], k.Jy[i]])}\n\nchosen: i = ${names[i]}, j = ${jn[j]}` + (j <= i ? `\nd = c${i} − p${j} = (${f(d[0])}, ${f(d[1])})\nswing = (d_y, −d_x) = (${f(d[1])}, ${f(-d[0])})` : `\nj > i: zero column`) + `\n\nv${i} = J${i} q̇ = ${vec(k.v[i])} m/s   (|v| = ${f(Math.hypot(...k.v[i]))})`); }
  if (st === 3) { const K = L.map((l, i) => .5 * l.m * (k.v[i][0] ** 2 + k.v[i][1] ** 2) + .5 * l.I * k.w[i] ** 2); const qMq = .5 * S.qd.reduce((s, v, i) => s + v * k.M[i].reduce((t, w, j) => t + w * S.qd[j], 0), 0);
    h = EQ(`ω = cumsum(q̇) = ${vec(k.w, 2)} rad/s\nK by link = ${vec(K, 3)} J,  Σ = ${f(K.reduce((a, b) => a + b))} J\n½ q̇ᵀ M q̇ = ${f(qMq)} J   (the same number)\n\n${mat(k.M, 3, 'M')}\n\nM[0][1] by hand: Σ over torso, arms of m (swing_0 · swing_1) + I\n  = ${[1, 2, 3].map(i => `${L[i].m}×(${f(swing(i, 0)[0], 2)}·${f(swing(i, 1)[0], 2)} + ${f(swing(i, 0)[1], 2)}·${f(swing(i, 1)[1], 2)}) + ${L[i].I}`).join('\n  + ')}\n  = ${f(k.M[0][1])}`); }
  if (st === 4) { const P = L.map((l, i) => l.m * m.g * k.c[i][1]); h = EQ(`P by link = ${vec(P, 2)} J,  Σ = ${f(P.reduce((a, b) => a + b), 2)} J\n\ng_j = −g Σ_{i≥j} m_i (c_i − p_j)_x\n${[0, 1, 2, 3].map(j => `g${j} = −9.81 × (${L.map((l, i) => i >= j ? `${l.m}×${f(k.c[i][0] - k.p[j][0], 3)}` : null).filter(Boolean).join(' + ')}) = ${f(k.g[j], 2)} N·m`).join('\n')}\n\ngravity moment about the ankle = m_tot g x_c = ${f(UB.mtot(m) * m.g * kc.xc[0], 2)} N·m = −g0`); }
  if (st === 5) h = EQ(`a_i with q̈ = 0:\n${[0, 1, 2, 3].map(i => `a${i} = ${vec(k.a[i], 2)} m/s²`).join('\n')}\n\nc_j = Σ_{i≥j} m_i (J_i column j · a_i)\nc = ${vec(k.cvec, 2)} N·m\n\n(check: with q̇ = 0 every a_i is 0 and c vanishes; double every q̇ and c quadruples)`);
  if (st === 6) h = EQ(`τ = M q̈ + c + g\n\n${mat(k.M, 2, 'M')}\n\nc = ${vec(k.cvec, 2)}\ng = ${vec(k.g, 2)}\n\nto keep exactly these rates (q̈ = 0):  τ = c + g = ${vec(k.cvec.map((v, i) => v + k.g[i]), 2)} N·m\nto hold still (q̇ = 0 too):            τ = g\n\nankle row: the foot can supply at most m g × foot = ${f(UB.tauAnkleMax(m), 1)} N·m`);
  if (st === 7) { const free = [0, 1, 2, 3].filter(j => j !== S.lock); const qd0 = S.qd.map((v, j) => j === S.lock ? 0 : v); const Lk = UB.locked(m, S.q, qd0, free);
    h = EQ(`locked: ${jn[S.lock]}   free columns: ${free.join(', ')}\n\n${mat(Lk.M, 3, 'SᵀMS')}\n\nSᵀc = ${vec(Lk.c, 2)}   (with q̇_${S.lock} = 0)\nSᵀg = ${vec(Lk.g, 2)}\n\ndiagonal entries kept: ${free.map(j => `M[${j}][${j}] = ${f(k.M[j][j])}`).join(', ')}`); }
  if (st === 8) h = EQ(`H_O by link = ${vec(k.link_H, 3)},  Σ = ${f(k.H_O, 3)} N·m·s\n\n${mat(k.A_O, 3, 'A_O')}\nA_O q̇ = ${vec(mv(k.A_O, S.qd), 3)}   (rows: p_x, p_y, H_O)\n\nrow 0 of M at this q: ${vec(k.M[0], 3)}\nrow H of A_O:         ${vec(k.A_O[2], 3)}\n(equal when q = 0; set every slider to 0 to see it)`);
  el.innerHTML = h;
}
