<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why admittance</title>
<link rel="stylesheet" href="steplab.css">
<script src="nn.js"></script><script src="beam.js"></script><script src="steplab.js"></script>
</head><body>
<script>
const f = SL.f, E = SL.eq, ul = SL.ul;
const st = () => { const v = SL.v; return { N: v.N, Jr: v.Jr * 1e-5, bw: v.bw / 10, Jl: .9, fr: v.fr / 10 }; };
SL.app({
  title: 'Why admittance, and not impedance',
  sub: 'A 100:1 harmonic drive makes the choice for you. Page 38\'s decision, with this gearbox as the deciding evidence.',
  view: '2d',
  legend: [['--bad', 'reflected rotor N²J'], ['--a', 'link'], ['--c', 'rendered law'], ['--e', 'hardware above the corner'], ['--b', 'admittance pass-through']],
  controls: [
    { id: 'N', label: 'gear ratio N', min: 1, max: 160, value: 100, fmt: x => x + ':1' },
    { id: 'Jr', label: 'rotor inertia', min: 1, max: 30, value: 10, fmt: x => NN.e(x * 1e-5, 1) + ' kg·m²' },
    { id: 'bw', label: 'velocity bandwidth', min: 10, max: 200, value: 50, fmt: x => f(x / 10, 1) + ' Hz' },
    { id: 'fr', label: 'harmonic-drive friction (step 1)', min: 0, max: 100, value: 40, fmt: x => f(x / 10, 1) + ' N·m' },
  ],
  steps: [
    ['The gearbox decides', 'J_eff = J_link + N²J_rotor. With N = 100 the rotor is reflected to the hip ×10 000 (page 29\'s square law).'],
    ['Non-backdrivable, and current lies', 'Add harmonic-drive friction and cogging: the joint is effectively non-backdrivable, and motor current stops being a usable estimate of the torque reaching the human. Honest torque control is not available, and impedance control (motion in, torque out) has nothing reliable to put out.'],
    ['So: measure torque, command motion', 'A cantilevered load cell in parallel with the actuator measures interaction torque; the drive is commanded in velocity mode. That is admittance control — the hardware chose it.'],
    ['The trick in the parameters', 'ω_cmd = τ/(Ms² + Bs + K) with M = 10⁻³, B = 10⁻², K = 5×10⁻²: ω_n = √(K/M) ≈ 7.1 rad/s, ζ ≈ 0.7. So light and soft that the block is a torque-to-velocity pass-through — a torque source built from a non-backdrivable joint, keeping the passivity argument of an admittance with a real torque measurement (page 4\'s energy-injection warning bounded).'],
    ['The same trick, in reverse, is the control condition', '"No assist" is NOT motors off: the actuators actively emulate a transparent zero-impedance mode, compensating the device\'s intrinsic impedance, so the comparison isolates the momentum controller from hardware drag. The paper still declines to claim residual pelvis–torso coupling is exactly zero.'],
    ['What it costs above the bandwidth', 'Below the corner the wearer feels the rendered law. Above it, the reflected inertia and the 6 kg of hardware are what answer.'],
    ['The one-line decision rule', 'Backdrivable, low friction → impedance, torque out. Geared, stiff, non-backdrivable, with a force sensor → admittance, motion out. This device is the second case, and every downstream choice — velocity-mode drives, the load cell, the low virtual parameters, the transparent control condition — follows from it.'],
  ],
  draw(Pl) {
    const s = st(), S = SL.st, refl = s.N * s.N * s.Jr, Jeff = s.Jl + refl;
    if (S <= 2 || S === 6) {
      const B = Pl.panel(0, 0, .42, .82, [0, 3, 0, Math.max(2, Jeff * 1.15)], false); B.frame('inertia at the hip (kg·m²)');
      NN.bars(B, [s.Jl, refl, Jeff], { labels: ['link', 'N²J_rotor', 'J_eff'], cols: ['--a', '--bad', '--ink'], d: 2 });
      const Ns = [...Array(160)].map((_, i) => i + 1), P = Pl.panel(.43, 0, .57, .4, [1, 160, 0, Math.max(1, 160 * 160 * s.Jr / s.Jl)], false);
      P.series([{ pts: Ns.map(n => [n, n * n * s.Jr / s.Jl]), cl: '--bad', w: 2.5, label: 'rotor : link ratio vs N' }], { title: 'square law' }); P.line([s.N, 0], [s.N, P.b[3]], '--ink', 1, [3, 3]);
      const R = Pl.panel(.43, .42, .57, .4, [0, 1, 0, 1], false); R.frame();
      const back = s.fr < 1 && refl < .3 * s.Jl;
      NN.lines(R, S === 1 ? [['friction ' + f(s.fr, 1) + ' N·m + cogging', '--bad'], ['backdrivable? ' + (back ? 'yes' : 'NO'), back ? '--c' : '--bad'], ['τ ≈ k_t·i·N ? ' + (back ? 'roughly' : 'no: friction eats it'), back ? '--c' : '--bad'], ['→ impedance (torque out): unreliable', '--bad']]
        : S === 2 ? [['load cell IN PARALLEL with the actuator', '--c'], ['  measures interaction torque τ', '--c'], ['drive in VELOCITY mode', '--b'], ['  τ in → ω_cmd out = admittance', '--b']]
        : S === 6 ? [['backdrivable + low friction → impedance', '--a'], ['geared + stiff + force sensor → admittance', '--b'], ['this device: N = 100, load cell', '--ink'], ['→ ' + (s.N > 20 ? 'ADMITTANCE' : 'impedance would be possible'), s.N > 20 ? '--b' : '--a']]
        : [['N = ' + s.N + ' → ×' + (s.N * s.N), '--bad'], ['reflected ' + f(refl, 2) + ' vs link ' + f(s.Jl, 2), '--ink'], ['rotor : link = ' + f(refl / s.Jl, 1) + '×', '--bad'], ['J_eff = ' + f(Jeff, 2) + ' kg·m²', '--ink']], { top: .15, gap: .2 });
    } else if (S <= 4) {
      const ts = [...Array(301)].map((_, i) => i * .004), M = 1e-3, Bd = 1e-2, K = 5e-2, wn = Math.sqrt(K / M), z = Bd / (2 * Math.sqrt(K * M)), wd = wn * Math.sqrt(1 - z * z);
      const P = Pl.panel(0, 0, .62, .82, [0, 1.2, -.1, 1.3], false);
      if (S === 3) P.series([{ pts: ts.map(t => [t, 1]), cl: '--grey', w: 1, dash: [4, 3], label: 'torque step' }, { pts: ts.map(t => [t, Math.exp(-z * wn * t) * (Math.cos(wd * t) - z * wn / wd * Math.sin(wd * t)) * 0 + (1 - Math.exp(-z * wn * t) * (Math.cos(wd * t) + z * wn / wd * Math.sin(wd * t)))]), cl: '--b', w: 2.5, label: 'rendered position (normalised)' }], { title: 'the rendered mechanism: ω_n ≈ 7.1 rad/s, ζ ≈ 0.71' });
      else { P.frame('three conditions'); NN.lines(P, [['baseline     no device worn', '--grey'], ['no assist    device worn, actively TRANSPARENT:', '--a'], ['             compensates its own impedance', '--a'], ['             (NOT motors off)', '--bad'], ['active       momentum controller on', '--c'], ['', ''], ['the comparison isolates the controller', '--ink'], ['from the hardware\'s drag', '--ink'], ['residual pelvis–torso coupling: not', '--muted'], ['claimed to be exactly zero', '--muted']], { top: .1, gap: .085 }); }
      const R = Pl.panel(.63, 0, .37, .82, [0, 1, 0, 1], false); R.frame();
      NN.lines(R, [['M = 1e−3, B = 1e−2, K = 5e−2', '--b'], ['ω_n = √(K/M) = ' + f(wn, 2) + ' rad/s', '--b'], ['ζ = B/(2√(KM)) = ' + f(z, 3), '--b'], ['', ''], ['so light and soft that', '--ink'], [' τ → ω_cmd ≈ pass-through', '--ink'], ['= a torque source that', '--c'], [' keeps an admittance\'s', '--c'], [' passivity argument', '--c']], { top: .1, gap: .09 });
    } else {
      const fs = [...Array(200)].map((_, i) => Math.pow(10, -1 + i * 3 / 199));
      const P = Pl.panel(0, 0, .64, .82, [-1, 2, -10, 50], false);
      const law = x => 20 * Math.log10(.2 + 0 * x), hw = x => 20 * Math.log10(Jeff * 2 * Math.PI * x);
      P.series([{ pts: fs.map(x => [Math.log10(x), x < s.bw ? law(x) : hw(x)]), cl: '--a', w: 3, label: 'felt impedance (dB, illustrative)' }, { pts: fs.map(x => [Math.log10(x), hw(x)]), cl: '--e', w: 1.5, dash: [4, 3], label: 'hardware: J_eff·ω' }], { title: 'what the wearer feels across frequency' });
      P.line([Math.log10(s.bw), -10], [Math.log10(s.bw), 50], '--grey', 1, [3, 3]); P.text([Math.log10(s.bw), 46], 'corner ' + f(s.bw, 1) + ' Hz', '--muted', 4, 0, { size: 11 });
      const R = Pl.panel(.65, 0, .35, .82, [0, 1, 0, 1], false); R.frame();
      NN.lines(R, [['below ' + f(s.bw, 1) + ' Hz:', '--c'], [' the rendered law', '--c'], ['above:', '--e'], [' J_eff = ' + f(Jeff, 2) + ' kg·m²', '--e'], [' + 6 kg worn', '--e'], ['', ''], ['tap it quickly: metal', '--bad']], { top: .1, gap: .1 });
    }
    const Bt = Pl.panel(0, .84, 1, .16, [0, 1, 0, 1], false); Bt.frame();
    NN.lines(Bt, [[`J_eff = J_link + N²J_rotor = ${f(s.Jl, 2)} + ${s.N}²·${NN.e(s.Jr, 1)} = ${f(Jeff, 2)} kg·m²  (rotor : link ${f(refl / s.Jl, 1)}×)`, '--ink']], { top: .55, gap: .3 });
  },
  math(S) {
    const s = st(), refl = s.N * s.N * s.Jr;
    const rows = [
`${E(`J_eff = J_link + N² J_rotor,  N = ${s.N}
= ${f(s.Jl, 2)} + ${f(refl, 3)} = ${f(s.Jl + refl, 3)} kg·m²`)}`,
`<p>Friction and cogging × 100:1 → current ≠ output torque.</p>`,
`${E(`impedance:  motion in → torque out
admittance: torque in (load cell) → motion out (velocity drive)`)}`,
`${E(`ω_cmd = τ/(Ms² + Bs + K)
ω_n = √(K/M) ≈ 7.1 rad/s,  ζ = B/(2√(KM)) ≈ 0.7`)}`,
`<p>Transparent control condition: the device compensates its intrinsic impedance rather than imposing it.</p>`,
`${E(`below the corner: the specified law
above: |Z| ≈ J_eff ω (+ worn mass)`)}`,
`<p>Every downstream choice follows from the gearbox.</p>`];
    return rows[S];
  },
  stats() { const s = st(); return `<span><b>J_eff</b>${f(s.Jl + s.N * s.N * s.Jr, 2)} kg·m²</span><span><b>mode</b>${s.N > 20 ? 'admittance' : 'impedance ok'}</span>`; },
});
</script>
</body></html>
