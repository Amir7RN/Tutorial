<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rotation matrices and SO(3)</title>
<link rel="stylesheet" href="steplab.css">
<script src="three.min.js"></script><script src="mr.js"></script><script src="steplab.js"></script>
</head><body>
<script>
const f = SL.f, E = SL.eq, ul = SL.ul, D2R = Math.PI / 180, X = [1, 0, 0], Y = [0, 1, 0], Z = [0, 0, 1];
const st = () => { const v = SL.v; return { x: v.x * D2R, y: v.y * D2R, z: v.z * D2R, t: v.t * D2R }; };
const Rzyx = s => MR.mul(MR.mul(MR.expRot(Z, s.z), MR.expRot(Y, s.y)), MR.expRot(X, s.x));
const T = (R, p = [0, 0, 0]) => MR.makeT(R, p);
SL.app({
  title: 'Rotation matrices and SO(3)',
  sub: 'A rotation is a 3 × 3 matrix whose columns are a frame\'s axes: 9 numbers held to 3 freedoms by 6 rules. Together they form SO(3), a curved, closed 3-D space. Drag to orbit; red/green/blue = x/y/z.',
  view: '3d', orbit: { az: .8, el: .4, r: 4.2, tgt: [0, 0, .3] },
  controls: [
    { id: 'z', label: 'rotate about z (yaw)', min: -180, max: 180, value: 40, fmt: x => x + '°' }, { id: 'y', label: 'about y (pitch)', min: -90, max: 90, value: 25, fmt: x => x + '°' },
    { id: 'x', label: 'about x (roll)', min: -180, max: 180, value: 15, fmt: x => x + '°' }, { id: 't', label: 'extra turn θ (steps 3, 5)', min: -180, max: 180, value: 60, fmt: x => x + '°' },
  ],
  steps: [
    ['Columns are the body axes', 'R_sb = [x̂_b ŷ_b ẑ_b] written in {s}. Read each column straight off the coloured arrows of the turned frame. The grey frame is {s}.'],
    ['Nine numbers, six rules, three freedoms', 'RᵀR = I: three unit-length columns and three perpendicular pairs — 6 rules on 9 numbers leave 3. det R = +1 picks right-handed frames (−1 would be a mirror). SO(3) = {R : RᵀR = I, det R = 1}.'],
    ['A picture of SO(3) you can hold', 'Every rotation is an axis ω̂ and an angle θ ≤ π: the point θω̂ in a solid ball of radius π. Antipodal points on the surface (π about ω̂ and about −ω̂) are the same rotation — closed and curved, not ℝ³. The dot is the current R.'],
    ['Rotations do not commute', 'R₁R₂ ≠ R₂R₁. Turn about x then z versus z then x: the two frames (solid vs faded) land differently, apart by an angle you can read off.'],
    ['Uses 1 and 2: orientation and change of frame', 'R_sb R_bc = R_sc (subscripts cancel); R_cs = R_scᵀ; p_s = R_sb p_b. A vector\'s length is the same in both frames.'],
    ['Use 3: rotate a frame — left vs right', 'Left: Rot(ẑ, θ)R turns about the FIXED {s} z-axis. Right: R Rot(ẑ, θ) turns about the frame\'s OWN z-axis. Same matrix, different axis, different result.'],
    ['Interview: why not Euler angles?', 'They have a singularity (ZYX at pitch ±90°: roll and yaw become the same rotation and the rate map loses rank), composition is not addition, and interpolating them gives curved, speed-varying motion. Compute with R or quaternions; orientation error as log(R_dᵀR), a 3-vector you can multiply by a gain. Slide pitch to ±90°.'],
  ],
  draw(sc) {
    const s = st(), S = SL.st, R = Rzyx(s);
    sc.grid(4, 16); sc.frame(MR.eye(4), .7, '{s}');
    if (S === 2) { const lg = MR.logRot(R), sph = sc.sphere([0, 0, 1], Math.PI / 3, '--a', { opacity: .12 }); sc.sphere(MR.add([0, 0, 1], MR.scl(lg, 1 / 3)), .06, '--e'); sc.arrow([0, 0, 1], MR.scl(lg, 1 / 3), '--e', 1); sc.label([0, 0, 1 + Math.PI / 3], 'ball of radius π (scaled ⅓)', '--muted'); return; }
    if (S === 3) { const A = MR.mul(MR.expRot(X, s.t), MR.expRot(Z, s.t)), B = MR.mul(MR.expRot(Z, s.t), MR.expRot(X, s.t)); sc.frame(T(A, [-.8, 0, .6]), .6, 'Rx·Rz'); sc.frame(T(B, [.8, 0, .6]), .6, 'Rz·Rx'); return; }
    if (S === 5) { const Rl = MR.mul(MR.expRot(Z, s.t), R), Rr = MR.mul(R, MR.expRot(Z, s.t)); sc.frame(T(R, [0, 0, .6]), .5, 'R'); sc.frame(T(Rl, [-1, 0, .6]), .6, 'left: about z_s'); sc.frame(T(Rr, [1, 0, .6]), .6, 'right: about z_b'); return; }
    sc.frame(T(R, [0, 0, .5]), 1, '{b}');
    if (S === 4) { const pb = [.6, .2, .3], ps = MR.mv(R, pb); sc.arrow([0, 0, .5], ps, '--e', 1); sc.label(MR.add([0, 0, .5], ps), 'p', '--e'); }
    if (S === 6) { const g = Math.abs(Math.abs(s.y) - Math.PI / 2) < .05; sc.label([0, 0, 1.8], g ? 'GIMBAL LOCK: roll and yaw now turn about the same axis' : 'pitch ' + f(s.y / D2R, 0) + '°', g ? '--bad' : '--muted'); }
  },
  math(S) {
    const s = st(), R = Rzyx(s), RtR = MR.mul(MR.T(R), R);
    const rows = [
`${E(SL.mat(R, 3, 'R_sb'))}<p>Column 1 = x̂_b in {s}, column 2 = ŷ_b, column 3 = ẑ_b.</p>`,
`${E(`‖x̂‖, ‖ŷ‖, ‖ẑ‖ = ${[0, 1, 2].map(j => f(MR.norm(MR.col(R, j)), 3)).join(', ')}
x̂·ŷ, ŷ·ẑ, ẑ·x̂ = ${f(MR.dot(MR.col(R, 0), MR.col(R, 1)), 3)}, ${f(MR.dot(MR.col(R, 1), MR.col(R, 2)), 3)}, ${f(MR.dot(MR.col(R, 2), MR.col(R, 0)), 3)}
det R = ${f(MR.det(R), 3)}
${SL.mat(RtR, 2, 'RᵀR')}`)}`,
(() => { const lg = MR.logRot(R), th = MR.norm(lg); return `${E(`θ = ${f(th / D2R, 1)}°,  ω̂ = ${th > 1e-6 ? SL.vs(MR.scl(lg, 1 / th), 3) : '—'}
distance from centre = θ = ${f(th, 3)} ≤ π`)}`; })(),
(() => { const A = MR.mul(MR.expRot(X, s.t), MR.expRot(Z, s.t)), B = MR.mul(MR.expRot(Z, s.t), MR.expRot(X, s.t)), d = MR.norm(MR.logRot(MR.mul(MR.T(A), B))); return `${E(`angle between Rx·Rz and Rz·Rx = ${f(d / D2R, 1)}°`)}`; })(),
(() => { const pb = [.6, .2, .3], ps = MR.mv(R, pb); return `${E(`R_sb R_bc = R_sc,   R_cs = R_scᵀ
p_b = ${SL.vs(pb)}  →  p_s = R_sb p_b = ${SL.vs(ps)}
‖p_b‖ = ${f(MR.norm(pb), 3)} = ‖p_s‖ = ${f(MR.norm(ps), 3)}`)}`; })(),
`${E(`left:  R′ = Rot(ẑ, θ) R     (about z of {s})
right: R″ = R Rot(ẑ, θ)     (about z of the frame itself)`)}`,
`${E(`ZYX: R = Rz(ψ) Ry(θ) Rx(φ);  at θ = ±90°, φ and ψ act about one axis
orientation error: log(R_dᵀ R) ∈ ℝ³`)}`];
    return rows[S];
  },
});
</script>
</body></html>
