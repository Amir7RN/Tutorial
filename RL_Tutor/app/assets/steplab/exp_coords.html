<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why ω, and exponential coordinates</title>
<link rel="stylesheet" href="steplab.css">
<script src="mr.js"></script><script src="nn.js"></script><script src="steplab.js"></script>
</head><body>
<script>
const f = SL.f, E = SL.eq, ul = SL.ul, D2R = Math.PI / 180;
const st = () => { const v = SL.v; return { w: [v.p / 10, v.q / 10, v.r / 10], dt: v.dt / 1000, N: v.N, th: v.th * D2R, ax: MR.unit([v.ax / 10, v.ay / 10, 1]) }; };
const eulRates = (w, phi, th) => { const [p, q, r] = w, a = q * Math.sin(phi) + r * Math.cos(phi); return [p + a * Math.tan(th), q * Math.cos(phi) - r * Math.sin(phi), a / Math.cos(th)]; };
const series = (W, N) => { let S = MR.eye(3), term = MR.eye(3); for (let k = 1; k <= N; k++) { term = MR.mscl(MR.mul(term, W), 1 / k); S = MR.madd(S, term); } return S; };
const integ = s => { let A = MR.eye(3), B = MR.eye(3); const n = MR.norm(s.w), out = []; for (let k = 0; k <= Math.round(3 / s.dt); k++) { if (k % Math.max(1, Math.round(.02 / s.dt)) === 0) out.push([k * s.dt, MR.det(A), MR.det(B)]);
  A = MR.mul(A, n > 1e-9 ? MR.expRot(MR.scl(s.w, 1 / n), n * s.dt) : MR.eye(3)); B = MR.madd(B, MR.mscl(MR.mul(B, MR.skew(s.w)), s.dt)); } return out; };
SL.app({
  title: 'Why ω, gyros vs Euler rates, exponential coordinates',
  sub: 'Store velocity as ω: Ṙ wastes six numbers and Euler-angle rates blow up at gimbal lock. Follow a constant ω for θ and you land on R = e^[ω̂]θ — Rodrigues\' formula.',
  view: '2d',
  legend: [['--a', 'ω / exact'], ['--bad', 'Euler rates / naive'], ['--c', 'matrix exponential'], ['--b', 'partial sums']],
  controls: [
    { id: 'p', label: 'body rate p', min: -20, max: 20, value: 2, fmt: x => f(x / 10, 1) }, { id: 'q', label: 'body rate q', min: -20, max: 20, value: 10, fmt: x => f(x / 10, 1) }, { id: 'r', label: 'body rate r', min: -20, max: 20, value: 5, fmt: x => f(x / 10, 1) },
    { id: 'dt', label: 'time step Δt (step 2)', min: 1, max: 200, value: 50, fmt: x => x + ' ms' }, { id: 'N', label: 'series terms (step 3)', min: 1, max: 15, value: 3 },
    { id: 'th', label: 'angle θ (steps 3–4)', min: 0, max: 180, value: 120, fmt: x => x + '°' }, { id: 'ax', label: 'axis tilt x (steps 3–4)', min: -20, max: 20, value: 5, fmt: x => f(x / 10, 1) }, { id: 'ay', label: 'axis tilt y', min: -20, max: 20, value: -3, fmt: x => f(x / 10, 1) },
  ],
  steps: [
    ['Three numbers work for velocity, not for orientation', 'At any R, the allowed Ṙ form a 3-D tangent space, and ω is a global, singularity-free coordinate for it. Orientation itself (SO(3)) has no global 3-number chart. So: 3 numbers for velocity always; 3 numbers for orientation only locally.'],
    ['Gyros measure ω; Euler rates blow up', 'A gyro reads body rates (p, q, r). ZYX Euler rates: φ̇ = p + (q sin φ + r cos φ)tan θ, θ̇ = q cos φ − r sin φ, ψ̇ = (q sin φ + r cos φ)/cos θ. Divide by cos θ: as pitch → ±90° the same physical spin needs infinite coordinate rates.'],
    ['Integrate with the exponential', 'R_{k+1} = R_k e^{[ω_b]Δt} stays exactly on SO(3). The naive R + ṘΔt leaves it: det R drifts every step. Raise Δt and watch.'],
    ['ẋ = Ax ⇒ x = e^{At}x₀, and Rodrigues', 'Ṙ = [ω̂]R with constant ω̂ is linear, so R(θ) = e^{[ω̂]θ}. The series I + [ω̂]θ + ([ω̂]θ)²/2! + … collapses (because [ω̂]³ = −[ω̂]) to I + sin θ[ω̂] + (1 − cos θ)[ω̂]². Partial sums approach it — watch det and the error shrink with terms.'],
    ['The log: back from R to (ω̂, θ)', 'cos θ = (tr R − 1)/2, then [ω̂] = (R − Rᵀ)/(2 sin θ). Exponential coordinates ω̂θ ∈ ℝ³: three numbers for an orientation — fine locally, ambiguous at θ = π, the standard way to express an orientation error.'],
    ['Interview: what is angular velocity, why not Euler rates?', 'Differentiating RᵀR = I makes RᵀṘ skew: Ṙ = [ω_s]R = R[ω_b]. ω is the physical spin a gyro measures, finite everywhere; Euler rates are coordinate rates of a chart and divide by cos(pitch). Integrate with R ← R e^{[ω_b]Δt}, not R + ṘΔt.'],
  ],
  draw(Pl) {
    const s = st(), S = SL.st;
    if (S <= 1) { const ths = [...Array(179)].map((_, i) => (-89 + i) * D2R), P = Pl.panel(0, 0, .64, .82, [-90, 90, -20, 20], false);
      P.series([{ pts: ths.map(t => [t / D2R, Math.max(-20, Math.min(20, eulRates(s.w, .4, t)[0]))]), cl: '--bad', w: 2, label: 'φ̇' }, { pts: ths.map(t => [t / D2R, eulRates(s.w, .4, t)[1]]), cl: '--b', w: 2, label: 'θ̇' }, { pts: ths.map(t => [t / D2R, Math.max(-20, Math.min(20, eulRates(s.w, .4, t)[2]))]), cl: '--e', w: 2, label: 'ψ̇' }, { pts: ths.map(t => [t / D2R, MR.norm(s.w)]), cl: '--a', w: 2.5, dash: [5, 4], label: '|ω| (gyro)' }], { title: 'Euler rates for the same body ω vs pitch θ (roll φ = 0.4)' });
      NN.lines(Pl.panel(.65, 0, .35, .82, [0, 1, 0, 1], false), [['ω_b = (p, q, r) = ' + SL.vs(s.w, 1), '--a'], ['|ω| = ' + f(MR.norm(s.w), 2) + ' (finite always)', '--a'], ['', ''], ['at pitch 80°:', '--muted'], [' ψ̇ = ' + f(eulRates(s.w, .4, 80 * D2R)[2], 2), '--bad'], ['at pitch 89°:', '--muted'], [' ψ̇ = ' + f(eulRates(s.w, .4, 89 * D2R)[2], 1), '--bad'], ['', ''], ['chart rates ÷ cos θ', '--bad']], { top: .1, gap: .09 }); }
    else if (S === 2) { const d = integ(s), P = Pl.panel(0, 0, .64, .82, [0, 3, .9, Math.max(1.3, ...d.map(q => q[2])) ], false);
      P.series([{ pts: d.map(q => [q[0], q[1]]), cl: '--a', w: 2.5, label: 'det, R ← R e^{[ω]Δt}' }, { pts: d.map(q => [q[0], q[2]]), cl: '--bad', w: 2.5, label: 'det, R ← R + ṘΔt' }], { title: 'staying on SO(3): det R over 3 s' });
      NN.lines(Pl.panel(.65, 0, .35, .82, [0, 1, 0, 1], false), [['Δt = ' + f(1000 * s.dt, 0) + ' ms', '--ink'], ['exp: det = ' + f(d[d.length - 1][1], 6), '--a'], ['naive: det = ' + f(d[d.length - 1][2], 4), '--bad'], ['', ''], ['naive steps leave SO(3)', '--bad'], [' (frame grows, skews)', '--bad']], { top: .12, gap: .1 }); }
    else { const W = MR.skew(MR.scl(s.ax, s.th)), Rr = MR.expRot(s.ax, s.th), errs = [...Array(15)].map((_, k) => [k + 1, Math.log10(Math.max(1e-16, Math.max(...MR.msub(series(W, k + 1), Rr).flat().map(Math.abs)))) ]);
      if (S === 3) { const P = Pl.panel(0, 0, .55, .82, [1, 15, -16, 1], false); P.series([{ pts: errs, cl: '--b', w: 2.5, label: 'log₁₀ max |partial sum − Rodrigues|' }], { title: 'series convergence' }); P.line([s.N, -16], [s.N, 1], '--ink', 1, [3, 3]); }
      const Sm = series(W, s.N), lg = MR.logRot(Rr), tl = MR.norm(lg);
      NN.lines(Pl.panel(S === 3 ? .56 : 0, 0, S === 3 ? .44 : 1, .82, [0, 1, 0, 1], false), S === 3 ? [['ω̂ = ' + SL.vs(s.ax), '--ink'], ['θ = ' + f(s.th / D2R, 0) + '°', '--ink'], [s.N + '-term partial sum:', '--b'], ['  det = ' + f(MR.det(Sm), 5), '--b'], ['Rodrigues:', '--c'], ...SL.mat(Rr, 3).split('\n').map(l => ['  ' + l, '--c']), ['det = ' + f(MR.det(Rr), 6), '--c']]
        : [['R = e^{[ω̂]θ} = I + sin θ[ω̂] + (1 − cos θ)[ω̂]²', '--c'], ...SL.mat(Rr, 3, 'R').split('\n').map(l => [l, '--c']), ['log R:  cos θ = (tr R − 1)/2 = ' + f((MR.trace(Rr) - 1) / 2, 4) + '  →  θ = ' + f(tl / D2R, 2) + '°', '--a'], ['        ω̂ = ' + SL.vs(MR.scl(lg, 1 / Math.max(1e-9, tl)), 3) + '   (set: ' + SL.vs(s.ax, 3) + ')', '--a'], ['exponential coordinates ω̂θ = ' + SL.vs(lg, 3), '--ink'], [S === 5 ? 'gyro → ω; integrate with exp; error as log(R_dᵀR)' : 'ambiguous at θ = π (two axes); identity: axis undefined', '--muted']], { top: .1, gap: .085 }); }
    const Bt = Pl.panel(0, .84, 1, .16, [0, 1, 0, 1], false); Bt.frame();
    NN.lines(Bt, [[S <= 1 ? 'ψ̇ = (q sin φ + r cos φ)/cos θ → ∞ as θ → ±90°' : S === 2 ? 'R_{k+1} = R_k e^{[ω_b]Δt}' : 'Rot(ω̂, θ) = e^{[ω̂]θ} = I + sin θ[ω̂] + (1 − cos θ)[ω̂]²', '--ink']], { top: .55, gap: .3 });
  },
  math(S) {
    const s = st();
    const rows = [`<p>ω lives in the tangent space: 3 numbers, everywhere. Orientation: no global 3-number chart.</p>`,
`${E(`φ̇ = p + (q sin φ + r cos φ) tan θ
θ̇ = q cos φ − r sin φ
ψ̇ = (q sin φ + r cos φ)/cos θ`)}`,
`${E(`exp:   R ← R e^{[ω_b]Δt}   (exactly on SO(3))
naive: R ← R + R[ω_b]Δt     (det grows by ≈ 1 + |ω|²Δt²/… each step)`)}`,
`${E(`e^{[ω̂]θ} = I + (θ − θ³/3! + …)[ω̂] + (θ²/2! − θ⁴/4! + …)[ω̂]²
         = I + sin θ[ω̂] + (1 − cos θ)[ω̂]²`)}`,
`${E(`cos θ = (tr R − 1)/2,   [ω̂] = (R − Rᵀ)/(2 sin θ)`)}`,
`<p>Gyros measure ω; Euler rates are a chart's coordinate rates.</p>`];
    return rows[S];
  },
});
</script>
</body></html>
