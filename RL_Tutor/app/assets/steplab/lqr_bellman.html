<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LQR as Continuous RL</title>
<link rel="stylesheet" href="steplab.css">
<style>
  .grid{grid-template-columns:minmax(0,1.1fr) minmax(400px,1fr)}
  #pl{width:100%;height:100%;display:block;min-height:360px}
  .plot{position:relative;flex:1;min-height:380px;padding:4px}
  .chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .chips button{font-size:.78rem;font-weight:400;padding:3px 8px;border-radius:99px}
  .chips button[aria-current="true"]{background:var(--hi);border-color:var(--a);font-weight:700}
  .goal{border-left:3px solid var(--a);padding:2px 0 2px 8px;margin:0 0 8px}
  .do{border:1px dashed var(--c);border-radius:8px;padding:5px 9px;margin:8px 0 0;font-size:.86rem}
  .do b{color:var(--c)}
  .phys{background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:5px 9px;margin:6px 0 8px}
  .phys b{color:var(--e)}
  table.t{width:100%}
  table.t td,table.t th{text-align:left;font-family:var(--body);vertical-align:top}
  table.t td.m{font-family:var(--mono);white-space:nowrap}
  .ctl{grid-template-columns:190px 1fr 70px}
</style>
</head><body>
<div class="wrap">
  <div class="top"><h1>LQR is continuous-time reinforcement learning with the value function written as a matrix</h1>
    <p>An inverted pendulum (1 m, 1 kg). State x = (lean θ, lean rate θ̇), action u = torque. Every step derives one term, with the numbers of this pendulum.</p></div>
  <div class="grid">
    <div class="left">
      <div class="card plot"><canvas id="pl"></canvas></div>
      <div class="card"><div class="legend" id="leg"></div>
        <div class="controls" id="ctl" style="grid-template-columns:1fr;margin-top:6px"></div>
        <div class="btns" style="margin-top:6px"><button id="dflt">defaults</button></div></div>
    </div>
    <div class="side">
      <div class="card">
        <div class="chips" id="chips"></div>
        <div class="nav"><button id="prev">◀ back</button><button id="next" class="primary">next ▶</button></div></div>
      <div class="card math" id="exp"></div>
    </div>
  </div>
</div>
<script>
(() => {
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const f = (x, d = 3) => !isFinite(x) ? '∞' : (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d);
const DEF = { th: 0.1, om: 0, du: 0, dt: 0.05, s1: 10, s2: 1, rr: 1, al: 1.3, tau: 0.5, gl: 9.81 };
const S = { step: 0, p: { ...DEF } };

/* ---------- 2x2 linear algebra ---------- */
const mul = (X, Y) => X.map(r => Y[0].map((_, j) => r.reduce((s, v, k) => s + v * Y[k][j], 0)));
const T = X => X[0].map((_, j) => X.map(r => r[j]));
const add = (...Ms) => Ms[0].map((r, i) => r.map((_, j) => Ms.reduce((s, M) => s + M[i][j], 0)));
const sc = (X, s) => X.map(r => r.map(v => v * s));
const mv = (X, v) => X.map(r => r.reduce((s, a, k) => s + a * v[k], 0));
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
const quad = (P, x) => dot(x, mv(P, x));
const eigSym = M => { // 2x2 symmetric: values ascending, unit vectors
  const a = M[0][0], b = M[0][1], d = M[1][1], m = (a + d) / 2, h = Math.hypot((a - d) / 2, b);
  const vec = l => { const v = Math.abs(b) > 1e-12 ? [b, l - a] : (l === a ? [1, 0] : [0, 1]); const n = Math.hypot(...v); return [v[0] / n, v[1] / n]; };
  return [{ l: m - h, v: vec(m - h) }, { l: m + h, v: vec(m + h) }];
};
const eig2 = M => { const tr = M[0][0] + M[1][1], de = M[0][0] * M[1][1] - M[0][1] * M[1][0], D = tr * tr / 4 - de;
  return D >= 0 ? [{ re: tr / 2 - Math.sqrt(D), im: 0 }, { re: tr / 2 + Math.sqrt(D), im: 0 }] : [{ re: tr / 2, im: -Math.sqrt(-D) }, { re: tr / 2, im: Math.sqrt(-D) }]; };
const fpole = e => e.im ? f(e.re, 2) + (e.im < 0 ? ' − ' : ' + ') + f(Math.abs(e.im), 2) + 'j' : f(e.re, 3);
const fm = (M, d = 2) => '[' + M.map(r => r.map(v => f(v, d)).join(', ')).join(' ; ') + ']';

/* ---------- the pendulum ---------- */
const sys = (o = S.p) => ({ A: [[0, 1], [o.gl, 0]], B: [[0], [1]], b: [0, 1], Sm: [[o.s1, 0], [0, o.s2]], r: o.rr });
/* Lyapunov: F^T P + P F + M = 0, P symmetric; unknowns p11, p12, p22 */
function lyap(F, M) {
  const res = p => { const P = [[p[0], p[1]], [p[1], p[2]]], Z = add(mul(T(F), P), mul(P, F)); return [Z[0][0], Z[0][1], Z[1][1]]; };
  const G = [res([1, 0, 0]), res([0, 1, 0]), res([0, 0, 1])]; // columns
  const Mx = [[G[0][0], G[1][0], G[2][0]], [G[0][1], G[1][1], G[2][1]], [G[0][2], G[1][2], G[2][2]]], rhs = [-M[0][0], -M[0][1], -M[1][1]];
  const det3 = m => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const D = det3(Mx), p = [0, 1, 2].map(c => det3(Mx.map((r, i) => r.map((v, j) => j === c ? rhs[i] : v))) / D);
  return [[p[0], p[1]], [p[1], p[2]]];
}
const gainOf = (P, o) => { const s = sys(o); return [P[1][0] / s.r, P[1][1] / s.r]; }; // R^-1 B^T P with B = [0;1]
const leftover = (P, o) => { const s = sys(o); return add(s.Sm, mul(T(s.A), P), mul(P, s.A), sc([[P[0][1] * P[0][1], P[0][1] * P[1][1]], [P[1][1] * P[0][1], P[1][1] * P[1][1]]], -1 / s.r)); };
/* policy iteration (Kleinman): evaluate the rule with a Lyapunov solve, improve, repeat */
function kleinman(o = S.p, K0) {
  const s = sys(o); let K = K0 || [o.gl + 3, 1]; const its = [];
  for (let i = 0; i < 12; i++) {
    const F = [[0, 1], [o.gl - K[0], -K[1]]], M = add(s.Sm, sc([[K[0] * K[0], K[0] * K[1]], [K[1] * K[0], K[1] * K[1]]], s.r));
    const P = lyap(F, M); its.push({ K: K.slice(), P }); K = gainOf(P, o);
  }
  return its;
}
let memo = {};
const cached = (key, fn) => { if (!(key in memo)) { if (Object.keys(memo).length > 80) memo = {}; memo[key] = fn(); } return memo[key]; };
const solve = (o = S.p) => cached(['P', o.gl, o.s1, o.s2, o.rr].join(), () => { const its = kleinman(o), P = its[its.length - 1].P, K = gainOf(P, o);
  const s = sys(o), Acl = [[0, 1], [o.gl - K[0], -K[1]]]; return { P, K, Acl, poles: eig2(Acl), its, res: leftover(P, o) }; });
const xdot = (x, u, o = S.p) => [x[1], o.gl * x[0] + u];
/* simulate u = -K x from x0 (RK4, 2 ms) and add up the cost xᵀSx + uᵀRu */
function run(K, x0, Tend = 8, o = S.p) {
  return cached(['run', K[0], K[1], x0[0], x0[1], Tend, o.gl, o.s1, o.s2, o.rr].join(), () => {
    const h = 0.002, n = Math.round(Tend / h), s = sys(o);
    const rate = z => { const x = [z[0], z[1]], u = -dot(K, x), xd = xdot(x, u, o); return [xd[0], xd[1], quad(s.Sm, x) + s.r * u * u]; };
    let z = [x0[0], x0[1], 0]; const ts = [0], xs = [x0.slice()], cost = [0]; let fell = false;
    for (let i = 1; i <= n; i++) {
      const k1 = rate(z), k2 = rate(z.map((v, j) => v + h / 2 * k1[j])), k3 = rate(z.map((v, j) => v + h / 2 * k2[j])), k4 = rate(z.map((v, j) => v + h * k3[j]));
      z = z.map((v, j) => v + h / 6 * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j]));
      if (Math.abs(z[0]) > 50) { fell = true; break; }
      ts.push(i * h); xs.push([z[0], z[1]]); cost.push(z[2]);
    }
    return { ts, xs, cost, total: fell ? Infinity : cost[cost.length - 1], fell, h };
  });
}
/* value iteration in continuous time: the Riccati equation run backward from a deadline, P = 0 there */
const backward = (o = S.p) => cached(['bw', o.gl, o.s1, o.s2, o.rr].join(), () => {
  const h = 0.002, n = Math.round(3 / h), d = P => leftover(P, o); let P = [[0, 0], [0, 0]]; const ts = [0], Ps = [P];
  for (let i = 1; i <= n; i++) {
    const k1 = d(P), k2 = d(add(P, sc(k1, h / 2))), k3 = d(add(P, sc(k2, h / 2))), k4 = d(add(P, sc(k3, h)));
    P = add(P, sc(add(k1, sc(k2, 2), sc(k3, 2), k4), h / 6)); ts.push(i * h); Ps.push(P);
  }
  return { ts, Ps, h };
});
const X0 = () => [S.p.th, S.p.om];

/* ---------- drawing ---------- */
const cv = document.getElementById('pl');
function frame() {
  const r = cv.getBoundingClientRect(), W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height)), pr = devicePixelRatio;
  if (cv.width !== Math.round(W * pr) || cv.height !== Math.round(H * pr)) { cv.width = Math.round(W * pr); cv.height = Math.round(H * pr); }
  const c = cv.getContext('2d'); c.setTransform(pr, 0, 0, pr, 0, 0); c.fillStyle = css('--panel'); c.fillRect(0, 0, W, H);
  return { c, W, H };
}
const nice = v => +(+v).toPrecision(3) + '';
function panel(G, o) {
  const { c, W, H } = G, x0 = (o.l || 0) * W + 52, x1 = (o.r === undefined ? 1 : o.r) * W - 12, y0 = o.top * H + 20, y1 = o.bot * H - 28;
  const [xa, xb] = o.xr, [ya, yb] = o.yr;
  const X = v => x0 + (v - xa) / (xb - xa) * (x1 - x0), Y = v => y1 - (Math.max(ya - 1e9, Math.min(yb + 1e9, v)) - ya) / (yb - ya) * (y1 - y0);
  if (o.under) { c.save(); c.beginPath(); c.rect(x0, y0, x1 - x0, y1 - y0); c.clip(); o.under({ X, Y, x0, x1, y0, y1 }); c.restore(); }
  c.strokeStyle = css('--line'); c.lineWidth = 1; c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  c.strokeStyle = css('--grey'); c.setLineDash([3, 3]);
  if (ya < 0 && yb > 0) { c.beginPath(); c.moveTo(x0, Y(0)); c.lineTo(x1, Y(0)); c.stroke(); }
  if (o.zx && xa < 0 && xb > 0) { c.beginPath(); c.moveTo(X(0), y0); c.lineTo(X(0), y1); c.stroke(); }
  c.setLineDash([]);
  c.fillStyle = css('--muted'); c.font = '11px ' + css('--body');
  c.textAlign = 'left'; c.fillText(o.title || '', x0, y0 - 6);
  c.textAlign = 'center'; c.fillText(o.xlab || '', (x0 + x1) / 2, y1 + 23);
  [xa, (xa + xb) / 2, xb].forEach(v => c.fillText(nice(v), X(v), y1 + 11));
  c.textAlign = 'right'; [ya, yb, ...(ya < 0 && yb > 0 ? [0] : [])].forEach(v => c.fillText(nice(v), x0 - 4, Y(v) + 4));
  if (o.ylab) { c.save(); c.translate(x0 - 40, (y0 + y1) / 2); c.rotate(-Math.PI / 2); c.textAlign = 'center'; c.fillText(o.ylab, 0, 0); c.restore(); }
  c.save(); c.beginPath(); c.rect(x0, y0, x1 - x0, y1 - y0); c.clip();
  (o.series || []).forEach(s => {
    const col = css(s.col); c.strokeStyle = c.fillStyle = col; c.lineWidth = s.w || 2; c.setLineDash(s.dash || []);
    if (s.dots) {
      s.xs.forEach((xv, i) => { if (i % (s.every || 1) === 0) { c.beginPath(); c.arc(X(xv), Y(s.ys[i]), s.sz || 2, 0, 7); c.fill(); } });
    } else {
      c.beginPath(); let on = false;
      s.xs.forEach((xv, i) => { const yv = s.ys[i]; if (!isFinite(yv)) { on = false; return; } on ? c.lineTo(X(xv), Y(yv)) : c.moveTo(X(xv), Y(yv)); on = true; });
      c.stroke();
    }
    c.setLineDash([]);
  });
  (o.vlines || []).forEach(v => { c.strokeStyle = css(v.col); c.setLineDash([4, 3]); c.lineWidth = 1.2; c.beginPath(); c.moveTo(X(v.x), y0); c.lineTo(X(v.x), y1); c.stroke(); c.setLineDash([]); });
  (o.over || (() => {}))({ X, Y, x0, x1, y0, y1 });
  (o.marks || []).forEach(m => {
    if (!isFinite(m.y) || !isFinite(m.x)) return;
    c.fillStyle = css(m.col); c.beginPath(); c.arc(X(m.x), Y(m.y), m.r || 5, 0, 7); c.fill();
    if (m.label) { c.font = 'bold 11px ' + css('--body'); c.textAlign = m.right ? 'right' : 'left'; c.fillText(m.label, X(m.x) + (m.right ? -8 : 8), Y(m.y) + (m.below ? 15 : -7)); }
  });
  c.restore();
  return { X, Y, x0, x1, y0, y1 };
}
const lin = (a, b, n = 300) => Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n);
const legend = items => document.getElementById('leg').innerHTML = items.map(([t, col, dash]) =>
  `<span><span class="sw" style="background:${dash ? 'repeating-linear-gradient(90deg,var(' + col + ') 0 4px,transparent 4px 7px)' : 'var(' + col + ')'}"></span>${t}</span>`).join('');
function arrow(c, ax, ay, bx, by, col, w = 2) {
  const L = Math.hypot(bx - ax, by - ay); if (L < 1) return;
  const an = Math.atan2(by - ay, bx - ax); c.strokeStyle = c.fillStyle = css(col); c.lineWidth = w;
  c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
  c.beginPath(); c.moveTo(bx, by); c.lineTo(bx - 9 * Math.cos(an - .4), by - 9 * Math.sin(an - .4)); c.lineTo(bx - 9 * Math.cos(an + .4), by - 9 * Math.sin(an + .4)); c.fill();
}
function text(c, s, x, y, col = '--ink', align = 'left', size = 12, bold = false) {
  c.fillStyle = css(col); c.font = (bold ? 'bold ' : '') + size + 'px ' + css('--body'); c.textAlign = align; c.fillText(s, x, y);
}
/* the map of V(x) = xᵀPx over the (θ, θ̇) plane: shading + level ellipses */
const TH = [-0.2, 0.2], OM = [-0.8, 0.8];
function vmap(G, o) {
  const { c } = G, P = o.P, Vs = o.levels || [0.05, 0.2, 0.5, 1, 2, 4];
  return panel(G, { l: o.l, r: o.r, top: o.top, bot: o.bot, xr: TH, yr: OM, zx: true, title: o.title, xlab: 'lean θ (rad)', ylab: 'lean rate θ̇ (rad/s)', series: o.series, marks: o.marks,
    under: ({ X, Y, x0, x1, y0, y1 }) => {
      const nx = 70, ny = 50, vmax = quad(P, [TH[1], OM[1]]) + quad(P, [TH[1], -OM[1]]);
      c.fillStyle = css('--a');
      for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
        const th = TH[0] + (i + .5) / nx * (TH[1] - TH[0]), om = OM[0] + (j + .5) / ny * (OM[1] - OM[0]);
        c.globalAlpha = .05 + .5 * Math.sqrt(Math.min(1, quad(P, [th, om]) / vmax));
        const xa = Math.floor(x0 + i * (x1 - x0) / nx), xb = Math.floor(x0 + (i + 1) * (x1 - x0) / nx), ya = Math.floor(y1 - (j + 1) * (y1 - y0) / ny), yb = Math.floor(y1 - j * (y1 - y0) / ny);
        c.fillRect(xa, ya, xb - xa, yb - ya);
      }
      c.globalAlpha = 1;
      const E = eigSym(P);
      Vs.forEach(v => { c.strokeStyle = css('--ink'); c.globalAlpha = .45; c.lineWidth = 1; c.beginPath();
        for (let k = 0; k <= 200; k++) { const ph = k / 200 * 2 * Math.PI, a = Math.sqrt(v / E[0].l) * Math.cos(ph), b = Math.sqrt(v / E[1].l) * Math.sin(ph);
          const p = [a * E[0].v[0] + b * E[1].v[0], a * E[0].v[1] + b * E[1].v[1]]; k ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1])); }
        c.stroke(); c.globalAlpha = 1; });
      if (o.axes) E.forEach((e, i) => { c.strokeStyle = css(i ? '--bad' : '--c'); c.lineWidth = 2; c.setLineDash([7, 4]); c.beginPath(); c.moveTo(X(-5 * e.v[0]), Y(-5 * e.v[1])); c.lineTo(X(5 * e.v[0]), Y(5 * e.v[1])); c.stroke(); c.setLineDash([]); });
      (o.lines || []).forEach(Ln => { c.strokeStyle = css(Ln.col); c.lineWidth = 1.5; c.setLineDash([2, 3]); c.beginPath(); c.moveTo(X(-5), Y(-5 * Ln.slope)); c.lineTo(X(5), Y(5 * Ln.slope)); c.stroke(); c.setLineDash([]); });
    },
    over: o.over });
}
function pendulum(G, cx, cy, L, th, u, col = '--a') {
  const { c } = G, ex = cx + L * Math.sin(th), ey = cy - L * Math.cos(th);
  c.strokeStyle = css('--grey'); c.setLineDash([4, 4]); c.lineWidth = 1; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx, cy - L * 1.15); c.stroke(); c.setLineDash([]);
  c.strokeStyle = css(col); c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.moveTo(cx, cy); c.lineTo(ex, ey); c.stroke(); c.lineCap = 'butt';
  c.fillStyle = css('--ink'); c.beginPath(); c.arc(ex, ey, 9, 0, 7); c.fill();
  c.fillStyle = css('--muted'); c.fillRect(cx - 30, cy + 2, 60, 10);
  if (u) { c.strokeStyle = css('--b'); c.lineWidth = 2.5; c.beginPath(); const s = Math.sign(u), R = 24; c.arc(cx, cy, R, -Math.PI / 2 - .9, -Math.PI / 2 + .9); c.stroke();
    const an = -Math.PI / 2 + s * .9, ax = cx + R * Math.cos(an), ay = cy + R * Math.sin(an); arrow(c, ax - s * 6, ay - 6, ax + s * 2, ay + 2, '--b', 2.5); text(c, 'torque u', cx, cy + 28, '--b', 'center', 11, true); }
}

/* ---------- plots ---------- */
const PLOTS = {
  intro(G) {
    const { c, W, H } = G, sol = solve(), x0 = X0(), sim = run(sol.K, x0, 3), free = run([0, 0], x0, 1.2);
    const t = Math.min(S.p.tau, sim.ts[sim.ts.length - 1]), i = Math.round(t / sim.h), x = sim.xs[i], u = -dot(sol.K, x);
    pendulum(G, W * .16, H * .7, Math.min(W * .12, H * .4), x[0] * 2.5, u);
    text(c, 'pendulum at t = ' + f(t, 2) + ' s', W * .16, H * .12, '--ink', 'center', 12, true);
    text(c, '(lean drawn 2.5× larger)', W * .16, H * .12 + 15, '--muted', 'center', 11);
    vmap(G, { l: .33, top: 0, bot: 1, P: sol.P, title: 'the state plane: where the pendulum is, and the map V(x) shaded',
      series: [{ xs: free.xs.map(p => p[0]), ys: free.xs.map(p => p[1]), col: '--bad', w: 2, dash: [6, 4] }, { xs: sim.xs.map(p => p[0]), ys: sim.xs.map(p => p[1]), col: '--a', w: 3 }],
      marks: [{ x: x0[0], y: x0[1], col: '--ink', label: 'start' }, { x: x[0], y: x[1], col: '--b', r: 6, label: 'now', below: true }] });
    legend([['no torque: falls', '--bad', 1], ['LQR torque u = −Kx', '--a'], ['shading: V(x), cost still to pay', '--a']]);
  },
  map(G) {
    const sol = solve(), x = X0(), sim = run(sol.K, x, 8);
    vmap(G, { l: 0, r: .6, top: 0, bot: 1, P: sol.P, title: 'the map: V(θ, θ̇) = xᵀPx, rings of equal cost',
      series: [{ xs: sim.xs.map(p => p[0]), ys: sim.xs.map(p => p[1]), col: '--b', w: 2 }],
      marks: [{ x: x[0], y: x[1], col: '--ink', r: 6, label: 'x: V = ' + f(quad(sol.P, x), 3) }] });
    const n = Math.min(sim.ts.length - 1, Math.round(2.5 / sim.h)), ts = [], paid = [], left = [];
    for (let j = 0; j <= n; j += 10) { ts.push(sim.ts[j]); paid.push(sim.cost[j]); left.push(quad(sol.P, sim.xs[j])); }
    const V0 = quad(sol.P, x), top = Math.max(.01, V0 * 1.1);
    panel(G, { l: .6, top: 0, bot: 1, xr: [0, ts[ts.length - 1]], yr: [0, top], title: 'along the run: paid so far + V(x(t))', xlab: 'time t (s)',
      series: [{ xs: ts, ys: paid, col: '--b', dash: [6, 4] }, { xs: ts, ys: left, col: '--a', w: 3 }, { xs: ts, ys: ts.map((_, k) => paid[k] + left[k]), col: '--ink', w: 1.5 }] });
    legend([['V(x(t)) = xᵀPx: still to pay', '--a'], ['paid so far (sunk)', '--b', 1], ['sum: flat = V(x₀)', '--ink']]);
  },
  bellman(G) {
