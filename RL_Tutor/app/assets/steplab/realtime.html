<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One control cycle</title>
<link rel="stylesheet" href="steplab.css">
<script src="mr.js"></script><script src="ctl.js"></script><script src="steplab.js"></script>
</head><body>
<script>
const st = () => {
  const v = SL.v, f = v.f, fs = v.fs, T = 1 / fs, Td = v.td / 1000, fc = v.fc, C = v.comp / 1000;
  const k = Math.round(f / fs), fa = Math.abs(f - k * fs);
  const totalDelay = Td + T / 2;                                  // compute/transport delay + half a sample from the hold
  const pm = 90 - 360 * fc * totalDelay;                          // loop L = ωc/s · e^{−sT}
  return { f, fs, T, Td, fc, C, fa, totalDelay, pm, U: C / T, perCycle: fs / f };
};
/* closed loop y' = ωc (r − y(t − D)) with a unit step r */
const delayedLoop = (wc, D, Tend) => { const dt = 2e-5, n = Math.round(Tend / dt), lag = Math.round(D / dt), y = new Float64Array(n + 1), out = [];
  for (let i = 0; i < n; i++) { const yd = i - lag >= 0 ? y[i - lag] : 0; y[i + 1] = y[i] + dt * wc * (1 - yd); if (i % 20 === 0) out.push([i * dt, y[i]]); } return out; };
const f = SL.f, E = SL.eq, ul = SL.ul;
SL.app({
  title: 'One control cycle, step by step: sampling, aliasing, delay and the deadline',
  sub: 'A digital controller sees the world as dots, answers late, and must finish before the next tick. Change the signal, the loop rate, the delay and the compute time.',
  view: '2d',
  legend: [['--a', 'true signal'], ['--b', 'samples the controller sees'], ['--e', 'alias (what the dots look like)'], ['--c', 'output after the hold'], ['--bad', 'deadline']],
  controls: [
    { id: 'f', label: 'signal frequency f', min: 1, max: 1000, value: 20, fmt: x => x + ' Hz' },
    { id: 'fs', label: 'loop rate f_s', min: 50, max: 2000, step: 10, value: 1000, fmt: x => x + ' Hz' },
    { id: 'td', label: 'delay T_d', min: 0, max: 10, step: .1, value: 2, fmt: x => f(x, 1) + ' ms' },
    { id: 'fc', label: 'loop crossover f_c', min: 1, max: 100, value: 20, fmt: x => x + ' Hz' },
    { id: 'comp', label: 'compute time per tick', min: .05, max: 1.5, step: .05, value: .4, fmt: x => f(x, 2) + ' ms' },
  ],
  buttons: [{ label: '950 Hz at 1 kHz', onclick: () => { SL.setControl('f', 950); SL.setControl('fs', 1000); SL.redraw(); } },
            { label: '50 Hz, 2 ms delay', onclick: () => { SL.setControl('f', 50); SL.setControl('td', 2); SL.redraw(); } }],
  steps: [
    ['The controller only sees dots', 'Every 1/f_s seconds the controller reads the sensor once. Between ticks it knows nothing. At 1 kHz a 20 Hz motion gives 50 dots per cycle: plenty.'],
    ['Aliasing: the dots fit a slower sine', 'Raise f towards f_s. The same dots now fit a much slower sine (pink). The controller cannot tell them apart: 950 Hz sampled at 1 kHz looks exactly like 50 Hz.'],
    ['The folding diagram', 'Every input frequency appears at its distance from the nearest multiple of f_s. Above f_s/2 (the Nyquist frequency) frequencies fold back down. Only an analog filter before sampling can remove them.'],
    ['The hold: output is a staircase', 'The command is held constant between ticks. The staircase lags the smooth signal by half a sample on average, on top of the compute delay.'],
    ['Delay is phase', 'A delay of T_d seconds costs 360·f·T_d degrees at frequency f. 2 ms at 50 Hz is 36°. The same delay costs more at higher frequencies.'],
    ['What delay does to the loop', 'Phase lost at the crossover frequency comes straight out of the phase margin. Push the crossover up or the delay up and the closed loop rings, then goes unstable.'],
    ['The cycle budget', 'Each tick: read sensors, compute, write the command, all before the next tick. Utilisation C/T above 100 % means missed deadlines; jitter is variation in when the output appears.'],
    ['Three numbers that are not the same', 'Loop rate f_s, Nyquist f_s/2, and closed-loop bandwidth. The loop rate is not the bandwidth: keep f_s about 10–20× above the crossover so the delay stays a small part of the phase.'],
  ],
  draw(Pl) {
    const s = st(), S = SL.st, t = SL.ease(SL.anim);
    const span = S <= 1 || S === 3 ? Math.min(3 / s.f, 60 * s.T) : 0;
    if (S <= 1 || S === 3) {
      const Tw = S === 1 ? Math.max(2 / Math.max(s.fa, 1), 20 * s.T) : 3 / s.f, A = Pl.panel(0, 0, 1, .62, [0, Tw, -1.3, 1.3], false);
      const N = 600, sig = [...Array(N + 1)].map((_, i) => { const tt = i / N * Tw; return [tt, Math.sin(2 * Math.PI * s.f * tt)]; });
      A.series([{ pts: sig, cl: '--a', w: 2, label: 'true signal ' + s.f + ' Hz' }], { title: S === 3 ? 'zero-order hold: the command between ticks' : 'what the controller sees', yl: 'time window ' + f(Tw * 1000, 1) + ' ms' });
      const samples = []; for (let k = 0; k * s.T <= Tw; k++) samples.push([k * s.T, Math.sin(2 * Math.PI * s.f * k * s.T)]);
      if (S === 1) { const al = [...Array(N + 1)].map((_, i) => { const tt = i / N * Tw; return [tt, Math.sin(2 * Math.PI * (s.f - Math.round(s.f / s.fs) * s.fs) * tt)]; }); A.poly(al, '--e', 2.5 * t, [6, 3]); }
      if (S === 3) { const stair = []; samples.forEach(([tt, y], k) => { stair.push([tt + s.Td, y]); stair.push([tt + s.Td + s.T, y]); }); A.clip(() => A.poly(stair, '--c', 2.5)); }
      if (samples.length < 400) samples.forEach(p => A.dot(p, 3.5, '--b')); else A.label(A.x + 10, A.y + 34, samples.length + ' samples in view', '--b', { size: 12 });
    }
    if (S === 2) {
      const fmax = Math.max(2.2 * s.fs, s.f * 1.2), A = Pl.panel(0, 0, 1, .62, [0, fmax, 0, s.fs * .6], false);
      const pts = [...Array(401)].map((_, i) => { const x = i / 400 * fmax; return [x, Math.abs(x - Math.round(x / s.fs) * s.fs)]; });
      A.series([{ pts, cl: '--e', w: 2.5, label: 'apparent frequency after sampling' }], { title: 'input frequency (across) → frequency the controller sees (up)', yl: 'Hz' });
      A.line([s.fs / 2, 0], [s.fs / 2, s.fs * .6], '--bad', 1.5, [6, 3]); A.text([s.fs / 2, s.fs * .55], 'Nyquist f_s/2 = ' + s.fs / 2 + ' Hz', '--bad', 6, 0, { size: 12 });
      A.dot([s.f, s.fa], 6, '--a'); A.text([s.f, s.fa], s.f + ' Hz → ' + f(s.fa, 0) + ' Hz', '--a', 8, -8, { size: 12 });
      for (let k = 1; k * s.fs <= fmax; k++) A.text([k * s.fs, 0], k + '·f_s', '--muted', -10, -6, { size: 11 });
    }
    if (S === 4) {
      const Tw = 2 / s.f, A = Pl.panel(0, 0, 1, .62, [0, Tw, -1.3, 1.3], false), N = 400;
      const a = [...Array(N + 1)].map((_, i) => [i / N * Tw, Math.sin(2 * Math.PI * s.f * i / N * Tw)]), b = a.map(([tt]) => [tt, Math.sin(2 * Math.PI * s.f * (tt - s.Td * t))]);
      A.series([{ pts: a, cl: '--a', w: 2, label: 'what you asked for' }, { pts: b, cl: '--c', w: 2.5, label: 'what arrives ' + f(s.Td * 1000, 1) + ' ms later' }], { title: 'delay = phase lag: ' + f(360 * s.f * s.Td, 1) + '° at ' + s.f + ' Hz' });
    }
    if (S === 5) {
      const A = Pl.panel(0, 0, .5, .62, [0, 12, -40, 95], false), pts = [...Array(121)].map((_, i) => { const D = i / 10 / 1000 + s.T / 2; return [i / 10, 90 - 360 * s.fc * D]; });
      A.series([{ pts, cl: '--c', w: 2.5, label: 'phase margin vs delay' }], { title: 'PM = 90° − 360·f_c·(T_d + T/2)', yl: 'deg' });
      A.line([0, 0], [12, 0], '--bad', 1.5, [5, 3]); A.dot([s.Td * 1000, s.pm], 6, '--a');
      const wc = 2 * Math.PI * s.fc, Tend = 6 / s.fc, resp = delayedLoop(wc, s.totalDelay, Tend), mx = Math.min(3, Math.max(1.3, ...resp.map(p => Math.abs(p[1]))));
      const B = Pl.panel(.51, 0, .49, .62, [0, Tend, -mx * .3, mx], false);
      B.series([{ pts: resp, cl: s.pm > 0 ? '--a' : '--bad', w: 2.5, label: 'closed-loop step, PM = ' + f(s.pm, 0) + '°' }], { title: 'the loop with this delay' }); B.line([0, 1], [Tend, 1], '--grey', 1, [4, 3]);
    }
    if (S === 6) {
      const n = 6, A = Pl.panel(0, 0, 1, .62, [0, n * s.T * 1000, 0, 4], false); A.frame('six ticks of a ' + s.fs + ' Hz loop (time in ms)');
      let late = 0;
      for (let k = 0; k < n; k++) { const t0 = k * s.T * 1000, jit = (Math.sin(k * 7.3) * .5 + .5) * .15 * s.C * 1000, rd = .05, wr = .03, c = s.C * 1000 + jit;
        const end = t0 + rd + c + wr, missed = end > t0 + s.T * 1000; if (missed) late++;
        const bar = (x0, w, y, cl) => A.poly([[x0, y], [x0 + w, y], [x0 + w, y + .6], [x0, y + .6]], cl, 1, null, cl, true);
        bar(t0, rd, 2.6, '--f'); bar(t0 + rd, c, 2.6, missed ? '--bad' : '--b'); bar(t0 + rd + c, wr, 2.6, '--c');
        A.line([t0, .4], [t0, 3.8], '--grey', 1, [3, 3]); A.text([t0, .5], 'tick ' + k, '--muted', 3, 0, { size: 11 }); }
      A.text([0, 1.6], 'read sensors (teal) → compute (orange; red = runs past the next tick) → write command (green)', '--muted', 6, 0, { size: 12 });
      A.text([0, 1.05], `utilisation C/T = ${f(s.U * 100, 0)} %   ${late ? late + ' of 6 deadlines missed' : 'every deadline met'}`, late ? '--bad' : '--c', 6, 0, { mono: true });
    }
    if (S === 7) {
      const A = Pl.panel(0, 0, 1, .62, [Math.log10(.5), Math.log10(5000), 0, 4], false); A.frame('three frequencies on one log axis (Hz)');
      [[s.fc, '--c', 'closed-loop bandwidth ≈ f_c'], [s.fs / 2, '--bad', 'Nyquist f_s/2'], [s.fs, '--b', 'loop rate f_s'], [s.f, '--a', 'signal f']].forEach(([x, cl, lab], i) => { const lx = Math.log10(x); A.line([lx, .5], [lx, 3.6], cl, 3); A.text([lx, 3.6 - i * .45], lab + ' = ' + f(x, 0), cl, 6, 0, { size: 12 }); });
      [1, 10, 100, 1000].forEach(x => A.text([Math.log10(x), .3], x + ' Hz', '--muted', -12, 0, { size: 11 }));
      A.text([Math.log10(.6), 1.1], 'ratio f_s / f_c = ' + f(s.fs / s.fc, 0) + (s.fs / s.fc >= 10 ? '  (≥ 10: fine)' : '  (< 10: delay eats the margin)'), s.fs / s.fc >= 10 ? '--c' : '--bad', 0, 0, { mono: true });
    }
    const R = Pl.panel(0, .64, 1, .36, [0, 1, 0, 1], false); R.frame();
    const L = (x, y, txt, cl) => R.label(R.x + R.w * x, R.y + R.h * y, txt, cl, { mono: true, size: 12 });
    L(.02, .2, `T = 1/f_s = ${f(s.T * 1000, 3)} ms`, '--ink'); L(.36, .2, `samples per signal cycle = ${f(s.perCycle, 1)}`, s.perCycle >= 2 ? '--ink' : '--bad');
    L(.02, .42, `alias: |f − round(f/f_s)·f_s| = ${f(s.fa, 1)} Hz`, s.f > s.fs / 2 ? '--e' : '--muted'); L(.52, .42, `Nyquist = ${s.fs / 2} Hz`, '--bad');
    L(.02, .64, `phase lost at f_c: 360·${s.fc}·${f(s.totalDelay * 1000, 2)} ms = ${f(360 * s.fc * s.totalDelay, 1)}°`, '--c'); L(.6, .64, `PM = ${f(s.pm, 1)}°`, s.pm > 30 ? '--c' : '--bad');
    L(.02, .86, `utilisation = C/T = ${f(s.U * 100, 0)} %`, s.U < .7 ? '--ink' : '--bad'); L(.36, .86, `f_s / f_c = ${f(s.fs / s.fc, 1)}`, '--ink');
  },
  math(S) {
    const s = st();
    const head = `<p class="cg">f = ${s.f} Hz, f_s = ${s.fs} Hz (T = ${f(s.T * 1000, 3)} ms), delay T_d = ${f(s.Td * 1000, 1)} ms, crossover f_c = ${s.fc} Hz, compute C = ${f(s.C * 1000, 2)} ms.</p>`;
    const rows = [
`${E(`T = 1/f_s = ${f(s.T * 1000, 3)} ms
samples per cycle = f_s / f = ${f(s.perCycle, 1)}`)}
<p>The controller acts on samples x[k] = x(kT). Many samples per cycle: the dots trace the motion faithfully. That number says nothing yet about how well the loop can <b>follow</b> the motion — that is bandwidth, a property of the closed loop.</p>`,
`${E(`sin(2π f kT) = sin(2π (f − m f_s) kT)  for every integer m   (since f_s T = 1)
apparent frequency = |f − round(f/f_s)·f_s| = |${s.f} − ${Math.round(s.f / s.fs)}·${s.fs}| = ${f(s.fa, 1)} Hz`)}
<p>${s.f > s.fs / 2 ? `<b>${s.f} Hz is above f_s/2</b>, so its samples are identical to a ${f(s.fa, 0)} Hz signal. A digital filter cannot separate signals whose samples are already the same.` : 'Below f_s/2 the apparent frequency is the true one. Press “950 Hz at 1 kHz”.'}</p>`,
`${ul(['Frequencies up to f_s/2 come through unchanged.', 'Above f_s/2 they fold: f → |f − m f_s|, a sawtooth.', 'Vibration, motor PWM ripple or electrical noise above f_s/2 lands inside your control band as a fake slow signal.', 'Cure: an analog anti-aliasing filter <b>before</b> the ADC, or sample faster and filter digitally before downsampling.'])}
${E(`now: ${s.f} Hz → ${f(s.fa, 1)} Hz`)}`,
`<p>A DAC (or a PWM duty update) holds each command for one period: a zero-order hold.</p>
${E(`average lag of the staircase = T/2 = ${f(s.T * 500, 3)} ms
plus compute / transport delay  = ${f(s.Td * 1000, 2)} ms
total effective delay D         = ${f(s.totalDelay * 1000, 3)} ms`)}
<p>The staircase is shifted right by T_d (the result of tick k appears T_d later). Faster loops shrink T/2; they do not shrink a slow computation or a slow bus.</p>`,
`${E(`phase lag = 360° · f · T_d = 360 · ${s.f} · ${f(s.Td, 4)} = ${f(360 * s.f * s.Td, 1)}°
at 50 Hz with 2 ms: 360 · 50 · 0.002 = 36°`)}
<p>Delay does not change the amplitude, only the timing, and its phase cost grows linearly with frequency. That is why a delay that is harmless at 5 Hz is fatal at 100 Hz.</p>`,
`<p>Simplest loop with crossover f_c: L(s) = ω_c/s · e^{−sD}, ω_c = 2π f_c. Without delay PM = 90°.</p>
${E(`PM = 90° − 360·f_c·D = 90 − 360·${s.fc}·${f(s.totalDelay, 5)} = ${f(s.pm, 1)}°
PM reaches 0 when D = 1/(4 f_c) = ${f(250 / s.fc, 2)} ms`)}
<p>${s.pm > 45 ? 'Comfortable.' : s.pm > 0 ? 'Low margin: the step rings.' : '<span class="cbad">Negative margin: the loop oscillates with growing amplitude.</span>'} Real loops have less than 90° to start with, so the budget is tighter.</p>`,
`${E(`period T = ${f(s.T * 1000, 3)} ms,  compute C = ${f(s.C * 1000, 2)} ms (+ read 0.05, write 0.03)
utilisation U = C/T = ${f(s.U * 100, 0)} %`)}
${ul(['Hard real-time: a missed deadline is a failure (motor current loop). Firm: late results are useless. Soft: late is just worse (logging, UI).', 'Keep U well below 100 % for the worst case (WCET), not the average.', 'Jitter (varying compute time) moves the output time around: it acts like a varying delay.', 'On an RTOS the control task gets the highest priority and a fixed period; everything else runs in the slack.'])}`,
`${E(`loop rate        f_s   = ${s.fs} Hz
Nyquist          f_s/2 = ${s.fs / 2} Hz   (highest frequency the samples represent)
bandwidth        ≈ f_c = ${s.fc} Hz   (what the closed loop can follow)
ratio f_s/f_c    = ${f(s.fs / s.fc, 1)}`)}
<p>Rule of thumb: f_s ≈ 10–20 × the bandwidth keeps the hold-plus-compute delay to a few degrees at crossover. Sampling at exactly 2× the bandwidth is the Nyquist <i>limit for representing</i> a signal, not a recipe for controlling it.</p>`];
    return head + rows[S];
  },
  stats() { const s = st(); return `<span><b>alias</b>${f(s.fa, 0)} Hz</span><span><b>PM</b>${f(s.pm, 0)}°</span><span><b>U</b>${f(s.U * 100, 0)} %</span>`; },
});
</script>
</body></html>
